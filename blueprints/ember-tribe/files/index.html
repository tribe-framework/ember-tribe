<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title><%= classifiedPackageName %></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}

    <link integrity="" rel="stylesheet" href="/@embroider/virtual/vendor.css">
    <link integrity="" rel="stylesheet" href="/@embroider/virtual/app.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    {{content-for "head-footer"}}
  </head>
  <body>
    <!-- Full-screen loading overlay shown while Ember boots -->
    <div
      class="d-flex align-items-center justify-content-center vh-100 w-100 position-fixed animate__animated animate__fadeIn animate__faster"
      id="loading"
      style="z-index: 11001"
    >
      <div class="position-relative" role="status" style="z-index: 1">
        <div class="spinner-grow text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <div
        style="z-index: 0"
        class="position-absolute vh-100 w-100 bg-light opacity-75"
      ></div>
    </div>
    
    {{content-for "body"}}

    <script src="/@embroider/virtual/vendor.js"></script>
    <script type="module">
      import Application from './app/app';
      import environment from './app/config/environment';

      Application.create(environment.APP);
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    {{content-for "body-footer"}}
  </body>
</html>
